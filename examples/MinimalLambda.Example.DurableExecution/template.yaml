AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Syntax-validated deployment template for MinimalLambda durable execution example

Resources:
  DurableExecutionFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Zip
      CodeUri: artifacts/MinimalLambda.Example.DurableExecution.zip
      Runtime: dotnet8
      Handler: MinimalLambda.Example.DurableExecution
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 30
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicDurableExecutionRolePolicy
      DurableConfig:
        ExecutionTimeout: 86400
        RetentionPeriodInDays: 7
      AutoPublishAlias: prod

Outputs:
  DurableExecutionAliasArn:
    Description: Qualified prod alias ARN used for durable invocation
    Value: !Sub "${DurableExecutionFunction.Arn}:prod"
