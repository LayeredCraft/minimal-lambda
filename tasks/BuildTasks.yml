version: '3'

tasks:
  clean:
    desc: Clean NuGet packages from Release folder
    silent: true
    cmds:
      - echo "🧹 Cleaning"
      - '[ -d ./nupkg ] && rm -r ./nupkg || true'
      - dotnet clean --configuration Release
  
  restore:
    desc: Restore NuGet dependencies
    silent: true
    deps: [ clean ]
    cmds:
      - echo "📥 Restoring dependencies"
      - dotnet restore
      - echo "✅ Dependencies restored"

  build:
    desc: Build solution in Release configuration
    silent: true
    deps: [ restore ]
    cmds:
      - echo "🔨 Building Release"
      - dotnet build --configuration Release --no-restore
      - echo "✅ Release build complete"

  build-debug:
    desc: Build solution in Debug configuration
    silent: true
    deps: [ restore ]
    cmds:
      - echo "🔨 Building Debug"
      - dotnet build --configuration Debug --no-restore
      - echo "✅ Debug build complete"

  pack:
    desc: Build the NuGet package
    silent: true
    deps: [ build ]
    cmds:
      - echo "📦 Packing Packages"
      - dotnet pack --configuration Release --no-build --output ./nupkg
      - echo "✅ Packed"
  
  publish-local:
    desc: Package and publish to local NuGet source for use in other solutions
    silent: true
    deps: [ pack ]
    vars:
      LOCAL_NUGET_SOURCE: '{{.LOCAL_NUGET_SOURCE | default "~/LocalNuGetPackages"}}'
    cmds:
      - echo "📦 Publishing to local NuGet source"
      - mkdir -p {{.LOCAL_NUGET_SOURCE}}
      - cp -f ./nupkg/*.nupkg {{.LOCAL_NUGET_SOURCE}}/
      - echo "✅ Published to {{.LOCAL_NUGET_SOURCE}}"
      - echo "💡 Add this source to your other solution with:"
      - echo "   dotnet nuget add source {{.LOCAL_NUGET_SOURCE}} --name local"

  aot-check:
    desc: Validates the AOT compatibility of the libraries
    silent: true
    cmds:
      - dotnet publish src/AotCompatibility.TestApp/AotCompatibility.TestApp.csproj /p:TreatWarningsAsErrors=true

  package-compat:
    desc: Validates packed durable package consumers on net10.0
    silent: true
    cmds:
      - bash scripts/test-package-compatibility.sh