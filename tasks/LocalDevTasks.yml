version: '3'

tasks:
  restore:
    desc: Restore NuGet dependencies locally
    silent: true
    cmds:
      - echo "📥 Restoring dependencies"
      - dotnet restore
      - echo "✅ Dependencies restored"

  build-debug:
    desc: Build solution in Debug configuration locally
    silent: true
    cmds:
      - echo "🔨 Building Debug configuration"
      - task: restore
      - dotnet build --configuration Debug --no-restore
      - echo "✅ Debug build complete"

  tools:restore:
    desc: Restore and reinstall local dotnet tools
    silent: true
    cmds:
      - echo "🛠️ Restoring dotnet tools"
      - dotnet tool restore
      - echo "✅ Tools restored"

  setup-git-hooks:
    desc: Install git commit hooks with Husky
    silent: true
    cmds:
      - echo "🪝 Setting up git commit hooks"
      - npm install
      - npm run prepare
      - echo "✅ Git commit hooks are ready"

  clean-all:
    desc: Clean all build artifacts and packages
    silent: true
    cmds:
      - echo "🧹 Cleaning all build artifacts"
      - dotnet clean --configuration Release
      - dotnet clean --configuration Debug
      - echo "🗑️ Removing bin and obj directories"
      - find . -type d -name "bin" -o -name "obj" | xargs rm -rf
      - echo "✅ Complete cleanup finished"

  test-watch:
    desc: Run tests in watch mode for TDD
    silent: true
    cmds:
      - task: test:watch

  lambda-test:
    desc: Start the AWS Lambda test tool
    silent: true
    cmds:
      - dotnet lambda-test-tool start --lambda-emulator-port 5050 --config-storage-path ./lambda_test_tool
  
  docs:serve:
    desc: Serve docs locally with Zensical and open browser
    silent: true
    cmds:
      - echo "📖 Serving Docs"
      - uv run zensical serve -f mkdocs.yml --open

  docs:build:
    desc: Build docs site with Zensical
    silent: true
    cmds:
      - echo "📖 Building Docs"
      - uv run zensical build -f mkdocs.yml
      - echo "✅ Docs built"

  release-dry-run:
    desc: Pack and validate isolated core and durable release manifests
    cmds:
      - ./scripts/dry-run-release-manifests.sh
