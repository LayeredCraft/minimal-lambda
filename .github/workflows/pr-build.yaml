name: PR Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '**.md'

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: write-all

jobs:
  build:
    uses: LayeredCraft/devops-templates/.github/workflows/pr-build.yaml@v10.3
    with:
      solution: MinimalLambda.sln
      buildConfiguration: Release
      dotnetVersion: 11.0.x
      hasTests: true
      useMtpRunner: true
      enableCodeCoverage: true
      runCdk: false
    secrets: inherit

  quality:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Install dotnet tools
        run: dotnet tool restore

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Validate AOT compatibility
        run: task build:aot-check

      - name: Run formatting
        run: task format:cleanupcode

      - name: Check for formatting changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ Code formatting issues detected!"
            echo "The following files need formatting:"
            git status --porcelain
            echo ""
            echo "Run the following commands locally to fix:"
            echo "  task format:all"
            exit 1
          fi

          echo "✅ All code is properly formatted!"
