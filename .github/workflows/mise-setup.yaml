name: Mise Setup

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - mise.toml
      - mise.lock
      - global.json
      - package.json
      - package-lock.json
      - pyproject.toml
      - uv.lock
      - .config/dotnet-tools.json
      - .github/workflows/mise-setup.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    name: setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Use an isolated .NET installation
        shell: bash
        run: echo "MISE_DOTNET_ROOT=$RUNNER_TEMP/mise-dotnet" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@v5.2.9
        with:
          version: 2026.11.8
          install: false
          cache: false
          env: false
          export_path: false
      - name: Install project tools
        run: mise install
      - name: Restore development environment
        run: mise run setup
      - name: Build
        run: mise exec -- dotnet build MinimalLambda.sln --configuration Release --no-restore
      - name: Test
        run: mise exec -- task test:all
      - name: Build documentation
        run: mise exec -- task local:docs:build
