name: Publish Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '**.md'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
      pull-requests: write
    uses: LayeredCraft/devops-templates/.github/workflows/publish-preview.yml@v10.1
    with:
      solution: MinimalLambda.sln
      dotnetVersion: 11.0.x
      prereleaseIdentifier: preview
      hasTests: false
      buildConfiguration: Release

  push:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: LayeredCraft/devops-templates/.github/actions/nuget-push@v10.1
        with:
          nuget_user: ${{ secrets.NUGET_USER }}
