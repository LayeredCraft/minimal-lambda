# This workflow will build a .NET project on push to main
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Main Build

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '**.md'

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:

    runs-on: ubuntu-latest
    
    timeout-minutes: 10

    steps:
      - name: Act Workaround # https://github.com/nektos/act/issues/973
        if: ${{ env.ACT }}
        run: curl -fsSL https://deb.nodesource.com/setup_22.x | bash && apt install -y nodejs

      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Build
        run: dotnet build --no-restore --configuration Release /p:TreatWarningsAsErrors=true

      - name: Run tests
        timeout-minutes: 3
        run: task test:ci

      - name: Validate AOT Compatability
        run: task build:aot-check

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/**/*.cobertura.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true