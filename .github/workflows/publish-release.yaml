name: Publish Core Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  preflight:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Guard and resolve core release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          python3 scripts/validate-release-artifacts.py \
            --lane core \
            --tag "$RELEASE_TAG" \
            --tag-only
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 11.0.100-preview.6.26359.118
      - name: Restore core package cohort
        run: dotnet restore MinimalLambda.Packages.slnf
      - name: Build core package cohort
        run: >-
          dotnet build MinimalLambda.Packages.slnf
          --configuration Release
          --no-restore
          -p:Version="${{ needs.preflight.outputs.version }}"
          -p:InformationalVersion="${{ needs.preflight.outputs.version }}"
      - name: Pack core package cohort
        run: >-
          dotnet pack MinimalLambda.Packages.slnf
          --configuration Release
          --no-build
          --output artifacts
          -p:Version="${{ needs.preflight.outputs.version }}"
          -p:InformationalVersion="${{ needs.preflight.outputs.version }}"
      - name: Guard core release manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python3 scripts/validate-release-artifacts.py
          --lane core
          --tag "$RELEASE_TAG"
          --artifacts artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  push:
    needs: [preflight, build]
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-nuget-packages
          path: artifacts
      - name: Recheck manifest and reject existing NuGet versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python3 scripts/validate-release-artifacts.py
          --lane core
          --tag "$RELEASE_TAG"
          --artifacts artifacts
          --check-nuget
      - name: Exchange GitHub OIDC token for temporary NuGet key
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish core packages and symbols without duplicate suppression
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # dotnet nuget push discovers and publishes adjacent .snupkg automatically.
          for package in artifacts/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json
          done
