name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

autolabeler:
  - label: 'type: feat'
    title:
      - '/^feat(\([^)]*\))?:/i'
  - label: 'type: fix'
    title:
      - '/^fix(\([^)]*\))?:/i'
  - label: 'type: docs'
    title:
      - '/^docs(\([^)]*\))?:/i'
  - label: 'type: refactor'
    title:
      - '/^refactor(\([^)]*\))?:/i'
  - label: 'type: test'
    title:
      - '/^test(\([^)]*\))?:/i'
  - label: 'type: chore'
    title:
      - '/^chore(\([^)]*\))?:/i'
  - label: 'type: ci'
    title:
      - '/^ci(\([^)]*\))?:/i'
  - label: 'type: revert'
    title:
      - '/^revert(\([^)]*\))?:/i'
  - label: 'breaking-change'
    title:
      - '/^(feat|fix|docs|refactor|test|chore|ci|revert)(\([^)]*\))?!:/i'

categories:
  - type: 'pre-include'
    when:
      labels:
        - 'type: feat'
        - 'type: fix'
        - 'type: docs'
        - 'type: refactor'
        - 'type: test'
        - 'type: chore'
        - 'type: ci'
        - 'type: revert'
        - 'breaking-change'
  - type: 'pre-exclude'
    when:
      labels:
        - 'skip-changelog'
        - 'internal'
  - title: '⚠️ Breaking Changes'
    when:
      label: 'breaking-change'
  - title: '🚀 Features'
    when:
      label: 'type: feat'
  - title: '🐛 Bug Fixes'
    when:
      label: 'type: fix'
  - title: '📚 Documentation'
    when:
      label: 'type: docs'
  - title: '🔄 Refactoring'
    when:
      label: 'type: refactor'
  - title: '✅ Tests'
    when:
      label: 'type: test'
  - title: '🔧 Maintenance'
    when:
      labels:
        - 'type: chore'
        - 'type: ci'
        - 'type: revert'
  - type: 'version-resolver'
    semver-increment: 'major'
    when:
      label: 'breaking-change'
  - type: 'version-resolver'
    semver-increment: 'minor'
    when:
      label: 'type: feat'
  - type: 'version-resolver'
    semver-increment: 'patch'
    when:
      labels:
        - 'type: fix'
        - 'type: docs'
        - 'type: refactor'
        - 'type: test'
        - 'type: chore'
        - 'type: ci'
        - 'type: revert'
  - type: 'version-resolver'
    semver-increment: 'patch'

template: |
  ## Summary
  
  SUMMARY_GOES_HERE
  
  ## Changes

  $CHANGES

commitish: 'main'
