name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

autolabeler:
  - label: 'type: feat'
    title:
      - '/^feat(\([^)]*\))?:/i'
  - label: 'type: fix'
    title:
      - '/^fix(\([^)]*\))?:/i'
  - label: 'type: docs'
    title:
      - '/^docs(\([^)]*\))?:/i'
  - label: 'type: refactor'
    title:
      - '/^refactor(\([^)]*\))?:/i'
  - label: 'type: test'
    title:
      - '/^test(\([^)]*\))?:/i'
  - label: 'type: chore'
    title:
      - '/^chore(\([^)]*\))?:/i'
  - label: 'type: ci'
    title:
      - '/^ci(\([^)]*\))?:/i'
  - label: 'breaking-change'
    title:
      - '/^(feat|fix|docs|refactor|test|chore|ci)(\([^)]*\))?!:/i'
  - label: 'breaking-change'
    body:
      - '/BREAKING CHANGE/i'

categories:
  - title: '🚀 Features'
    labels:
      - 'type: feat'
  - title: '🐛 Bug Fixes'
    labels:
      - 'type: fix'
  - title: '📚 Documentation'
    labels:
      - 'type: docs'
  - title: '🔄 Refactoring'
    labels:
      - 'type: refactor'
  - title: '✅ Tests'
    labels:
      - 'type: test'
  - title: '🔧 Maintenance'
    labels:
      - 'type: chore'
      - 'type: ci'
  - title: '⚠️ Breaking Changes'
    labels:
      - 'breaking-change'

version-resolver:
  major:
    labels:
      - 'breaking-change'
  minor:
    labels:
      - 'type: feat'
  patch:
    labels:
      - 'type: fix'
      - 'type: docs'
      - 'type: refactor'
      - 'type: test'
      - 'type: chore'
      - 'type: ci'
  default: patch

template: |
  ## Summary
  
  SUMMARY_GOES_HERE
  
  ## Changes

  $CHANGES

include-labels:
  - 'type: feat'
  - 'type: fix'
  - 'type: docs'
  - 'type: refactor'
  - 'type: test'
  - 'type: chore'
  - 'type: ci'
  - 'breaking-change'

exclude-labels:
  - 'skip-changelog'
  - 'internal'

prerelease-identifier: 'alpha'
commitish: 'main'
